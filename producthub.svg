<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
  <defs>
    <style>
      .purple-fill { fill: #4B286D; }
      .purple-stroke { stroke: #4B286D; }
      .green-fill { fill: #2B8000; }
      .green-stroke { stroke: #2B8000; }
      line { stroke-width: 8px; stroke-linecap: round; }
    </style>
  </defs>

  <g>
    <line x1="290" y1="220" x2="370" y2="100" class="purple-stroke" />
    <line x1="320" y1="240" x2="450" y2="240" class="purple-stroke" />
    <line x1="280" y1="270" x2="250" y2="370" class="purple-stroke" />
    <line x1="270" y1="250" x2="210" y2="290" class="purple-stroke" />
    <line x1="270" y1="220" x2="200" y2="160" class="purple-stroke" />
    <line x1="210" y1="305" x2="240" y2="360" class="purple-stroke" />

    <line x1="300" y1="210" x2="320" y2="130" class="green-stroke" />
    <line x1="300" y1="260" x2="360" y2="340" class="green-stroke" />
    <line x1="120" y1="240" x2="200" y2="230" class="green-stroke" />
  </g>

  <g stroke="none">
    <circle cx="290" cy="240" r="45" class="purple-fill" />

    <circle cx="370" cy="100" r="30" class="purple-fill" />
    <circle cx="470" cy="240" r="35" class="purple-fill" />
    <circle cx="375" cy="355" r="30" class="purple-fill" />
    <circle cx="250" cy="390" r="38" class="purple-fill" />
    <circle cx="200" cy="300" r="30" class="purple-fill" />
    <circle cx="190" cy="160" r="30" class="purple-fill" />

    <circle cx="90" cy="245" r="32" class="purple-fill" />

    <circle cx="325" cy="125" r="18" class="green-fill" />
    <circle cx="205" cy="230" r="18" class="green-fill" />
  </g>
</svg>